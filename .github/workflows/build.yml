name: Build and Release RPK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-rpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate release signing certificates
        run: |
          mkdir -p sign/release sign/debug
          openssl req -newkey rsa:2048 -nodes -keyout sign/release/private.pem -x509 -days 3650 -out sign/release/certificate.pem -subj "/C=CN/ST=Beijing/L=Beijing/O=Xiaomi/OU=Vela/CN=com.vela.rider.band10"
          cp sign/release/private.pem sign/private.pem
          cp sign/release/certificate.pem sign/certificate.pem
          cp sign/release/private.pem sign/debug/private.pem
          cp sign/release/certificate.pem sign/debug/certificate.pem

      - name: Generate assets and run physics verification
        run: npm test

      - name: Build Release RPK
        run: npm run release

      - name: Publish RPK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rider Band 10 v1.0.${{ github.run_number }}
          files: dist/*.rpk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
